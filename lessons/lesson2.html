<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lesson 2 — Numbers</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <main class="container">

    <h1>Lesson 2 — Numbers</h1>

    <section class="card">
      <h2>Vocabulary</h2>

      <ul>
        <li><strong>One</strong> = Um</li>
        <li><strong>Two</strong> = Dois</li>
        <li><strong>Three</strong> = Três</li>
        <li><strong>Four</strong> = Quatro</li>
        <li><strong>Five</strong> = Cinco</li>
      </ul>
    </section>

    <section class="card">

      <h2>Exercise</h2>

      <p><strong>Translate:</strong> “Três”</p>

      <div class="row">
        <input
          id="answerInput"
          type="text"
          placeholder="Type your answer..."
          autocomplete="off"
        />

        <button id="checkBtn" class="btn">
          Check
        </button>
      </div>

      <p id="feedback" class="feedback"></p>

      <div class="row">

        <a class="btn secondary" href="../index.html">
          Back to Home
        </a>

        <button id="nextBtn" class="btn" disabled>
          Next lesson
        </button>

      </div>

    </section>

  </main>

  <script src="../js/lesson2.js"></script>

</body>
</html>
