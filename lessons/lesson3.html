<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Lesson 3 — Days of the Week</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <main class="container">

    <h1>Lesson 3 — Days of the Week</h1>

    <section class="card">
      <h2>Vocabulary</h2>

      <ul>
        <li><strong>Monday</strong> = Segunda-feira</li>
        <li><strong>Tuesday</strong> = Terça-feira</li>
        <li><strong>Wednesday</strong> = Quarta-feira</li>
        <li><strong>Thursday</strong> = Quinta-feira</li>
        <li><strong>Friday</strong> = Sexta-feira</li>
        <li><strong>Saturday</strong> = Sábado</li>
        <li><strong>Sunday</strong> = Domingo</li>
      </ul>
    </section>

    <section class="card">

      <h2>Exercise</h2>

      <p><strong>Translate:</strong> “Segunda-feira”</p>

      <div class="row">
        <input
          id="answerInput"
          type="text"
          placeholder="Type your answer..."
          autocomplete="off"
        />

        <button id="checkBtn" class="btn">
          Check
        </button>
      </div>

      <p id="feedback" class="feedback"></p>

      <div class="row">
        <a class="btn secondary" href="../index.html">
          Back to Home
        </a>

        <button id="nextBtn" class="btn" disabled>
          Next lesson
        </button>
      </div>

    </section>

  </main>

  <script src="../js/lesson3.js"></script>

</html>
